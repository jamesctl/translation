name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.1', laravel: '^10.0', testbench: '^8.0', phpunit: '^10.5', dbal: '^3.6'}
          - {php: '8.2', laravel: '^11.0', testbench: '^9.0', phpunit: '^11.5', dbal: '^4.1'}
          - {php: '8.2', laravel: '^12.0', testbench: '^10.0', phpunit: '^11.5', dbal: '^4.1'}
          - {php: '8.3', laravel: '^13.0', testbench: '^11.0', phpunit: '^11.5', dbal: '^4.1'}
          - {php: '8.5', laravel: '^13.0', testbench: '^11.0', phpunit: '^11.5', dbal: '^4.1'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer require --no-update "laravel/framework:${{ matrix.laravel }}" "doctrine/dbal:${{ matrix.dbal }}"
      - run: composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --no-interaction --prefer-dist
      - run: composer test
